# Header keamanan. Di-include di setiap `location` yang memakai add_header, karena nginx membuang
# SEMUA add_header tingkat server begitu sebuah location mendefinisikan add_header sendiri.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Shader WebGL dikompilasi native sehingga tidak memerlukan 'unsafe-eval'. blob: untuk audio offline dan gambar.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
